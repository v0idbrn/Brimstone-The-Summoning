name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore native audio sink
        run: cp tools/android/MainActivity.kt android/app/src/main/kotlin/com/brimstone/brimstone_summoning/MainActivity.kt

      - name: Install Pillow and regenerate app icons
        run: |
          pip install pillow
          python tools/build_app_icons.py

      - name: Verify code format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --concurrency=1

      - name: Build APK (release)
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Prepare release artifacts
        run: |
          mkdir -p release_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release_artifacts/Brimstone-The-Summoning-${{ github.ref_name }}.apk
          # Also copy debug symbols for crash symbolication
          cp -r build/app/outputs/symbols release_artifacts/symbols-${{ github.ref_name }}
          # Create web portal zip for cross-reference
          flutter build web --release --base-href "/Brimstone-The-Summoning/"
          cd build/web
          zip -r ../../release_artifacts/Brimstone-Web-Portal.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_artifacts/Brimstone-The-Summoning-${{ github.ref_name }}.apk
            release_artifacts/Brimstone-Web-Portal.zip
          generate_release_notes: true
          draft: false
          prerelease: false