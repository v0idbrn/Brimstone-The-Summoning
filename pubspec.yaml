name: brimstone_summoning
description: "Brimstone: The Summoning - Gothic Roguelite Card Battler"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core Architecture
  flutter_riverpod: ^2.5.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  collection: ^1.18.0
  clock: ^1.1.3

  # Game Engine
  flame: ^1.18.0

  # Persistence
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # UI / Theming
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  # Cupertino Icons (for completeness)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0

  # Testing
  mocktail: ^1.0.0

  # Linting
  flutter_lints: ^6.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
