name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify assets
        run: |
          python tools/verify_assets.py
          python tools/ux_horror_auditor.py

      - name: Verify code format
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit & widget tests
        run: flutter test --concurrency=1 --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  build-web:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (verify builds)
        run: flutter build web --release --base-href "/Brimstone-The-Summoning/"

      - name: Audit web bundle
        run: python tools/audit_web_bundle.py