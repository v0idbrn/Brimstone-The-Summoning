name: Android APK + Web Portal Release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Upgrade Flutter to latest stable
        run: flutter upgrade

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run test suite
        run: flutter test --concurrency=1

      - name: Ensure clean Android project
        run: |
          if [ -d "android" ]; then
            rm -rf android
          fi
          flutter create --platforms=android --org com.brimstone --project-name brimstone_summoning .
          # Set app name and portrait orientation
          sed -i 's/android:label="[^"]*"/android:label="Brimstone: The Summoning"/' android/app/src/main/AndroidManifest.xml
          sed -i '/android:name="io.flutter.embedding.android.FlutterActivity"/a\            android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml
          # Restore the native PCM sink (AudioTrack) that flutter create overwrites.
          mkdir -p android/app/src/main/kotlin/com/brimstone/brimstone_summoning
          cp tools/android/MainActivity.kt android/app/src/main/kotlin/com/brimstone/brimstone_summoning/MainActivity.kt

      - name: Regenerate native + PWA icons
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/build_app_icons.py
          python3 tools/build_app_icons.py --check

      - name: Build release APK
        run: flutter build apk --release --split-debug-info=build/symbols

      - name: Build web portal (WASM SQLite)
        run: flutter build web --release

      - name: Copy APK to release name
        run: cp build/app/outputs/flutter-apk/app-release.apk Brimstone-The-Summoning.apk

      - name: Package web portal
        run: |
          cd build/web
          zip -r ../../Brimstone-Web-Portal.zip . -x "*.map"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brimstone-The-Summoning-APK
          path: Brimstone-The-Summoning.apk

      - name: Upload web portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brimstone-Web-Portal
          path: Brimstone-Web-Portal.zip

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: Brimstone-Obfuscation-Symbols
          path: build/symbols

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Brimstone: The Summoning — Latest Build (APK + Web Portal)"
          files: |
            Brimstone-The-Summoning.apk
            Brimstone-Web-Portal.zip
          generate_release_notes: false